server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CRITICAL for the access-image upload feature. nginx's default is 1m, so a
    # 5 MB screenshot is rejected by nginx with its own HTML 413 before the
    # request ever reaches Spring — the frontend then shows a generic failure and
    # the backend logs show nothing at all, because it never saw the request.
    # Kept in step with spring.servlet.multipart.max-request-size=6MB.
    client_max_body_size 6m;

    # Text assets only; images and fonts are already compressed and re-gzipping
    # them costs CPU for nothing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames (index-BC0F1UTM.js), so a given URL's
    # bytes can never change — safe to cache for a year.
    #
    # NB: nginx's add_header does NOT inherit into a location that declares its
    # own, so the security headers are repeated in every block that sets one.
    # Omitting them here would silently drop them for all bundle requests.
    location /assets/ {
        # One directive, not `expires 1y` + add_header: those emit two separate
        # Cache-Control headers ("max-age=31536000" and "public, immutable"), which
        # browsers merge but intermediary caches are free to interpret differently.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA history fallback: any path that isn't a real file returns index.html so
    # React Router can resolve it client-side. Deep links like /clients/7 would
    # otherwise 404 on a page refresh.
    #
    # index.html itself must never be cached: it is the only file whose name is
    # stable, and a stale copy points the browser at hashed bundles that no
    # longer exist after a redeploy — a blank page that a hard refresh fixes,
    # which is exactly the kind of bug nobody can reproduce on demand.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # "backend" is the compose service name; Docker's embedded DNS resolves it on
    # the shared network.
    location /api/ {
        proxy_pass http://backend:8082/api/;
        proxy_http_version 1.1;

        # Browsers attach an Origin header to same-origin POST/PUT/DELETE, not just
        # to cross-origin ones. Spring Security treats ANY request carrying Origin
        # as a CORS request and checks it against app.cors.allowed-origins, which
        # the prod profile deliberately leaves empty (fail closed) — so relaying the
        # header made the backend answer every browser login with
        # 403 "Invalid CORS request", while curl (which sends no Origin) worked fine.
        #
        # Clearing it is accurate rather than a workaround: the browser really is on
        # the same origin as this proxy, so no cross-origin grant is involved. It
        # also keeps working when the app is reached by IP or hostname instead of
        # localhost, which an allow-list of origins would not.
        #
        # Safe with respect to CSRF: auth is a bearer token in the Authorization
        # header, not a cookie, so a cross-site page cannot get the browser to
        # attach credentials in the first place (and the API is stateless with CSRF
        # disabled accordingly).
        #
        # If the API is ever served from a genuinely different origin than the UI,
        # remove this line and set CORS_ALLOWED_ORIGINS on the backend instead.
        proxy_set_header Origin "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream request bodies through instead of buffering the whole upload to
        # a temp file before contacting the backend.
        proxy_request_buffering off;

        # A multi-megabyte upload over a slow link can exceed the 60s default.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
