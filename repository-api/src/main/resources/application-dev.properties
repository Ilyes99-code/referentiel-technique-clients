# ── Local development profile ────────────────────────────────────────────
# H2 in FILE mode, under repository-api/data/. Was `jdbc:h2:mem:`, which kept the
# whole database in the JVM heap and discarded it on every shutdown.
#
# In-memory was misleading rather than merely inconvenient: DemoDataInitializer
# re-seeds its demo clients whenever the table is empty, so clients and modules
# reappeared after a restart and looked persistent, while anything actually entered
# by hand — uploaded images above all, since nothing re-creates those — was gone.
#
# AUTO_SERVER=TRUE lets a DB tool attach while the app is running.
# For a clean slate: stop the app and delete repository-api/data/.
spring.datasource.url=jdbc:h2:file:./data/technical_repository;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Convenient for a throwaway dev DB; a real environment uses Flyway migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=false
spring.h2.console.enabled=true

# Verbose auth tracing — fine to leave on locally, must NEVER ship to prod.
spring.security.debug=true
logging.level.org.springframework.security=TRACE
logging.level.com.clinic.repository_api=DEBUG

# Dev-only fallback secrets so the app runs out of the box locally. Both are
# overridable via env vars, and the prod profile has no such fallback — it
# fails fast at startup instead of silently signing/encrypting with a key
# that's sitting in source control.
app.jwt.secret=${JWT_SECRET:ett/+qul8Ui41omTFfWEv1upDnXNjOCp0TsJ6BLfhGM=}
app.jwt.access-token-expiration=900000
app.crypto.secret=${CREDENTIALS_SECRET:Wu5K2Fvuup0Ckj8lseRwHNc3PFFvmteRweLtzyncIPE=}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@2024!}

# Vite's dev server proxies /api itself, so this mainly matters if you ever
# call the backend directly (e.g. from a REST client) from the browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
