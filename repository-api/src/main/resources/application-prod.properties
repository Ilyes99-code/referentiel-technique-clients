# ── Production profile ───────────────────────────────────────────────────
# All values below are required env vars with NO fallback — startup fails
# fast rather than silently running with a dev secret or the wrong database.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema is owned by Flyway migrations, never by Hibernate auto-DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

spring.h2.console.enabled=false
spring.security.debug=false
logging.level.org.springframework.security=WARN
logging.level.com.clinic.repository_api=INFO

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.crypto.secret=${CREDENTIALS_SECRET}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD}

# Empty by default: no cross-origin browser access until explicitly configured
# for the real frontend origin(s), e.g. https://app.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── OpenAPI / Swagger UI ─────────────────────────────────────────────────
# Off unless explicitly switched on. Swagger UI is unauthenticated by necessity
# (the page must load before you can log in through it), and it publishes the
# complete endpoint inventory and every DTO shape to anyone who can reach the
# port — useful reconnaissance against an API whose whole purpose is storing
# client credentials.
#
# docker-compose sets SPRINGDOC_ENABLED=true so the documentation is usable on
# the local stack. Set it to false (or drop the variable) for anything
# internet-facing.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
