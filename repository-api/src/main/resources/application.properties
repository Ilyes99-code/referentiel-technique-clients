server.port=8082
spring.application.name=repository-api

# Local dev is the default so `mvn spring-boot:run` behaves as before.
# Real deployments must set SPRING_PROFILES_ACTIVE=prod explicitly.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Access-image uploads ─────────────────────────────────────────────────
# Bounds a single multipart request so an oversized body is rejected by the
# container before it is fully buffered. AccessImageService re-checks the same
# 5 MB ceiling against the materialised byte[] — this setting is a first line of
# defence, not the invariant. max-request-size leaves headroom for the part
# headers and boundary on top of one 5 MB file.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── OpenAPI / Swagger UI ─────────────────────────────────────────────────
# UI at /swagger-ui.html, raw spec at /v3/api-docs (JSON) or /v3/api-docs.yaml.
# The per-profile files decide whether it is exposed at all.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Group operations by controller and keep a stable order, rather than the
# effectively random order springdoc emits by default.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# Collapse the schema dump at the bottom of the page; it is noise on first read.
springdoc.swagger-ui.default-models-expand-depth=-1
# Keep the entered JWT across page reloads so a 15-minute token does not have to
# be re-pasted every time the page is refreshed.
springdoc.swagger-ui.persist-authorization=true
# /view/** is a leftover Thymeleaf page, not part of the JSON API.
springdoc.paths-to-match=/api/**
